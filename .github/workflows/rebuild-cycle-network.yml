name: Rebuild cycling network

on:
  push:
    branches: [main]
    paths:
      - "data/cycling/exclusions.json"
      - "scripts/build-cycle-network.js"
      - ".github/workflows/rebuild-cycle-network.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild cycling network
        run: node scripts/build-cycle-network.js

      - name: Commit generated network if changed
        run: |
          if git diff --quiet -- public/data/cycle-network.v1.json; then
            echo "Cycling network is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cycle-network.v1.json
          git commit -m "Rebuild cycling network"
          git push
