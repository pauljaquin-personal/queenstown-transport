<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queenstown Transport</title>

  <meta
    name="description"
    content="Live transport information for Queenstown, New Zealand."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f8;
      color: #172126;
    }

    header {
      background: #172126;
      color: white;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    main {
      min-height: calc(100vh - 65px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome {
      max-width: 600px;
      text-align: center;
    }

    .welcome h2 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .welcome p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #536168;
    }

    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 14px;
      border-radius: 20px;
      background: #e4f5e9;
      color: #176b37;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <header>
    <h1>Queenstown Transport</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Queenstown is moving.</h2>

      <p>
        Live traffic, buses, ferries, cycling and community
        transport reports for Queenstown.
      </p>

      <div class="status">
        ● Development version
      </div>
    </section>
  </main>

</body>
</html>
